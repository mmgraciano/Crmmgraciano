<!doctype html>
<html lang="es">
<head>

<title>Cumbre Wealth Management</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700&family=Newsreader:opsz,wght@6..72,300&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--celeste); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:120px; }
  .band svg { display:block; width:960px; height:120px; }
  .mountain { fill:var(--pizarra); }
  .horizon { fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linejoin:round; }
  .row { fill:none; stroke:var(--celeste); stroke-width:1; stroke-linejoin:round; }
  .row.a { stroke-opacity:.22; }
  .row.b { stroke-opacity:.4; }
  .dot { fill:var(--laton); }
  .words { position:absolute; left:var(--space-12); right:var(--space-12); bottom:var(--space-8); }
  .name { margin:0; font-weight:700; font-size:64px; line-height:.95; letter-spacing:-.05em; color:var(--ink); white-space:nowrap; }
  .name em { font-family:var(--font-display); font-style:normal; font-weight:300; letter-spacing:-.03em; }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-soft); max-width:440px; }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 120" width="960" height="120">
<!--
  blocks      celeste ground (el cielo, toda la portada) · pizarra cordillera de 960 de ancho y 8 a 112 de alto (la montaña, el bloque mayor) · laton un solo punto de 12px en el pico — ≈30% de 960×288 en pizarra
  arrangement una franja superior de lado a lado: la cordillera escalonada sangra por los dos bordes, el nombre debajo sobre el cielo
  pattern     líneas de cotización: el horizonte en ink y dos filas celeste dentro de la montaña, el motivo literal de la marca ("la cumbre se dibuja como la línea de un gráfico de mercado")
  scales      tramos planos de 20 a 40px, el pico a space-2 del borde superior, nombre a space-12 del borde izquierdo y space-8 del inferior
-->
