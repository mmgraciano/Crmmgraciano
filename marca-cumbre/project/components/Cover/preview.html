<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cumbre Wealth Management</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .piz { fill:var(--pizarra); }
  .soft { fill:var(--pizarra-soft); }
  .lat { fill:var(--laton); }
  .deep { fill:var(--ink); }
  .ground { fill:var(--paper); }
  .blk { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-12); right:var(--space-12); bottom:var(--space-8); }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:64px; line-height:.95; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); max-width:440px; }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      pizarra 512×120 (la marca, el bloque mayor) · laton 64×72 (la firma, chico) · pizarra-soft 192×120 (alivio) · ink 152×120 sangrando a la derecha — ≈37% de 960×288
  arrangement franja de bandas desiguales sangrando arriba, separadas por space-4, como los lomos de un archivo
  pattern     silueta de cumbres recortada en paper desde la base del bloque pizarra: el motivo literal del nombre, como el isotipo
  scales      lados en múltiplos de space-4 y space-8; separación space-4; esquinas radius-sm; picos a 48/64/72px de altura en pasos de space-2
-->
<rect class="piz blk" x="0" y="-8" width="512" height="120" rx="2"/>
<polygon class="ground" points="0,112 112,64 160,88 256,40 312,80 360,56 480,112"/>
<rect class="lat blk" x="528" y="-8" width="64" height="72" rx="2"/>
<rect class="soft blk" x="608" y="-8" width="192" height="120" rx="2"/>
<rect class="deep blk" x="816" y="-8" width="152" height="120" rx="2"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Cumbre Wealth Management</h1>
  <p class="tag">Patrimonio, mandatos y documentos en orden.</p>
</div>
</div>
</body>
</html>
