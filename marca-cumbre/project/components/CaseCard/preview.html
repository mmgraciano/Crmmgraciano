<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>CaseCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body class="cu">
<div style="padding:16px;max-width:620px">
  <article class="cu-card">
    <div class="cu-card-head">
      <div><div class="cu-card-ref">Mandato N° 0412/2026 · Cuenta 12915</div><h3>Laffitte, Ana María</h3></div>
      <span class="cu-badge firmado">Firmado</span>
    </div>
    <p style="margin:0;color:var(--ink-muted)">Administración discrecional, perfil moderado. Renovación anual con conformidad expresa del comitente.</p>
    <dl class="cu-card-seal" style="margin:0">
      <div><dt>Patrimonio</dt><dd>USD 1.284.500</dd></div>
      <div><dt>Rendimiento 12m</dt><dd class="laton">+8,42 %</dd></div>
      <div><dt>Vence</dt><dd>30/06/2027</dd></div>
    </dl>
  </article>
</div>
</body>
</html>
